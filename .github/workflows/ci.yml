name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build and development tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Build wheel
        run: python -m build --wheel

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  lock:
    # Reproducibility gate: the toolchain comes from a hashed lockfile, not from
    # whatever PyPI published this morning.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install from hashed lockfile
        # No pip upgrade here on purpose: the installer must be the one the
        # runner ships, otherwise this gate is only as reproducible as PyPI.
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install project without re-resolving
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Test against the locked toolchain
        run: python -m pytest -q

      - name: Types against the locked toolchain
        run: python -m mypy src
